version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: courses_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: courses_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: courses_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/courses_db
      JWT_SECRET: production_jwt_secret_change_me
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      - mysql

volumes:
  mysql_data:
